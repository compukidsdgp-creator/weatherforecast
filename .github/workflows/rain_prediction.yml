# .github/workflows/rain_alert.yml
# ============================================================
#  Daily Rain Alert — GitHub Actions
#  Runs every morning at 7:00 AM IST (1:30 AM UTC)
#
#  Secrets needed  (Settings → Secrets → Actions):
#    TELEGRAM_BOT_TOKEN
#    TELEGRAM_CHAT_ID
#
#  Variables needed (Settings → Variables → Actions):
#    CITY, LATITUDE, LONGITUDE
# ============================================================

name: 🌧️ Daily Rain Alert

on:
  schedule:
    - cron: "30 1 * * *"    # 7:00 AM IST every day
  workflow_dispatch:         # manual trigger from Actions tab
  push:
    branches: [main]         # also runs on every push (for testing)

jobs:
  rain-alert:
    runs-on: ubuntu-latest

    steps:

      # 1. Download your repo code onto GitHub's machine
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install only what the script needs
      - name: Install libraries
        run: pip install scikit-learn

      # 4. Run the prediction script
      #    Secrets and Variables are passed as environment variables
      - name: Run rain prediction
        run: python predict_rain.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          CITY:               ${{ vars.CITY }}
          LATITUDE:           ${{ vars.LATITUDE }}
          LONGITUDE:          ${{ vars.LONGITUDE }}
